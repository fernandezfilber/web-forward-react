services:
  fv-backend:
    build:
      context: ./backend
    container_name: fv_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    labels:
      - traefik.enable=true
      - traefik.docker.network=shared-infra
      - traefik.http.routers.fv_backend.rule=(Host(`forwardvision.cloud`) || Host(`www.forwardvision.cloud`)) && PathPrefix(`/api`)
      - traefik.http.routers.fv_backend.entrypoints=websecure
      - traefik.http.routers.fv_backend.tls.certresolver=letsencrypt
      - traefik.http.routers.fv_backend.priority=100
      - traefik.http.services.fv_backend.loadbalancer.server.port=5000
    networks:
      - app
      - shared-infra

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fv_frontend_prod
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=shared-infra
      - traefik.http.routers.fv_frontend.rule=Host(`forwardvision.cloud`) || Host(`www.forwardvision.cloud`)
      - traefik.http.routers.fv_frontend.entrypoints=websecure
      - traefik.http.routers.fv_frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.fv_frontend.priority=50
      - traefik.http.services.fv_frontend.loadbalancer.server.port=80
    networks:
      - app
      - shared-infra

networks:
  app:
    driver: bridge
  shared-infra:
    external: true
