services:
  db:
    image: mysql:8.0
    container_name: fv_db_prod
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
    ports:
      - "3308:3306"
    volumes:
      - mysqldata_prod:/var/lib/mysql
    networks:
      - app
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER}", "-p${DB_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: fv_redis_prod
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 256mb --maxmemory-policy allkeys-lru --appendonly yes
    volumes:
      - redisdata_prod:/data
    networks:
      - app
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  fv-backend:
    build:
      context: ./backend
    container_name: fv_backend_prod
    restart: unless-stopped
    env_file:
      - .env.prod
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.fv_backend.rule=(Host(`forwardvision.cloud`) || Host(`www.forwardvision.cloud`)) && PathPrefix(`/api`)
      - traefik.http.routers.fv_backend.entrypoints=websecure
      - traefik.http.routers.fv_backend.tls.certresolver=letsencrypt
      - traefik.http.routers.fv_backend.priority=100
      - traefik.http.services.fv_backend.loadbalancer.server.port=5000
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app
      - traefik-proxy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: fv_frontend_prod
    restart: unless-stopped
    labels:
      - traefik.enable=true
      - traefik.docker.network=traefik-proxy
      - traefik.http.routers.fv_frontend.rule=Host(`forwardvision.cloud`) || Host(`www.forwardvision.cloud`)
      - traefik.http.routers.fv_frontend.entrypoints=websecure
      - traefik.http.routers.fv_frontend.tls.certresolver=letsencrypt
      - traefik.http.routers.fv_frontend.priority=50
      - traefik.http.services.fv_frontend.loadbalancer.server.port=80
    networks:
      - app
      - traefik-proxy

volumes:
  mysqldata_prod:
  redisdata_prod:

networks:
  app:
    driver: bridge
  traefik-proxy:
    external: true
