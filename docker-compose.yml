version: '3.9'

services:
  # ── MySQL 8 ──────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: fv_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE:      ${DB_NAME:-forwardvision_db}
      MYSQL_USER:          ${DB_USER:-fv_user}
      MYSQL_PASSWORD:      ${DB_PASSWORD:-fv_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_secret}
    volumes:
      - mysqldata:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - fv_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "${DB_USER:-fv_user}", "-p${DB_PASSWORD:-fv_secret}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # ── Redis 7 ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: fv_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - fv_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend API (Node.js + Prisma) ───────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fv_backend
    restart: unless-stopped
    environment:
      NODE_ENV:               development
      PORT:                   5000
      DATABASE_URL:           mysql://${DB_USER:-fv_user}:${DB_PASSWORD:-fv_secret}@db:3306/${DB_NAME:-forwardvision_db}
      REDIS_HOST:             redis
      REDIS_PORT:             6379
      REDIS_PASSWORD:         ${REDIS_PASSWORD:-redis_secret}
      JWT_SECRET:             ${JWT_SECRET:-dev_jwt_secret_muy_largo_cambiar_prod}
      JWT_REFRESH_SECRET:     ${JWT_REFRESH_SECRET:-dev_refresh_secret_cambiar_prod}
      JWT_EXPIRES_IN:         ${JWT_EXPIRES_IN:-15m}
      CLOUDINARY_CLOUD_NAME:  ${CLOUDINARY_CLOUD_NAME}
      CLOUDINARY_API_KEY:     ${CLOUDINARY_API_KEY}
      CLOUDINARY_API_SECRET:  ${CLOUDINARY_API_SECRET}
      GOOGLE_CLIENT_ID:       ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET:   ${GOOGLE_CLIENT_SECRET}
      SESSION_SECRET:         ${SESSION_SECRET:-fv_dev_session_secret}
      FRONTEND_URL:           http://localhost
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fv_network
    volumes:
      - ./backend:/app
      - /app/node_modules

  # ── Frontend React (Vite dev) ─────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: fv_frontend
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    restart: unless-stopped
    environment:
      VITE_API_URL: /api
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - fv_network

  # ── Nginx Reverse Proxy ───────────────────────────────────────
  nginx:
    image: nginx:1.25-alpine
    container_name: fv_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - frontend
    networks:
      - fv_network

volumes:
  mysqldata:
  redisdata:

networks:
  fv_network:
    driver: bridge
